    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>BKMB Subsales — PWA</title>
        <link rel="manifest" href="/manifest.json" />
        <meta name="theme-color" content="#2d6cdf" />
        <style>
          body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial; margin: 0; padding: 16px; }
          header { display:flex; align-items:center; gap:12px; }
          .hidden{ display:none }
          input, button, textarea { font-size:1rem; padding:8px; margin:4px 0; width:100%; box-sizing:border-box }
          .row { display:flex; gap:8px }
          .col-2 { flex:1 }
          .orders { margin-top:12px }
          .order { border:1px solid #ddd; padding:8px; margin-bottom:8px }
          .status-offline { color:orange }
          .status-online { color:green }
          .qty-row { display:flex; gap:8px }
          .qty-row input { width:100px }
        </style>
      </head>
      <body>
        <header>
          <h1>BKMB Subsales</h1>
          <div id="installBox" class="hidden"><button id="installBtn">Install App</button></div>
        </header>

        <main>
          <section id="loginSection">
            <h2>Team Login</h2>
            <p>Sign in with your team name and access code. After login the PWA install prompt will be shown (if available).</p>
            <input id="teamName" placeholder="Team name" />
            <input id="teamCode" placeholder="Access code" />
            <button id="loginBtn">Login</button>
          </section>

          <section id="appSection" class="hidden">
            <div class="row">
              <div class="col-2">
                <h2>Create Order</h2>
                <label>Customer Name</label>
                <input id="customerName" placeholder="Customer name" />
                <label>Customer Address</label>
                <input id="address" placeholder="Address" />
                <label>Cell Number</label>
                <input id="cellNumber" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Cell number" />
                <div class="qty-row">
                  <div>
                    <label>Turkey</label>
                    <input id="turkeyQty" type="number" min="0" value="0" />
                  </div>
                  <div>
                    <label>Ham</label>
                    <input id="hamQty" type="number" min="0" value="0" />
                  </div>
                  <div>
                    <label>Combo</label>
                    <input id="comboQty" type="number" min="0" value="0" />
                  </div>
                </div>
                <input id="donationAmount" type="number" min="0" step="0.01" value="0" placeholder="Donation amount (USD)" />
                <div style="margin-top:8px">Order Total: $<span id="orderTotal">0.00</span></div>
                <div style="margin-top:8px">
                  <label><input type="checkbox" id="payCheck" /> Check</label>
                  <label style="margin-left:12px"><input type="checkbox" id="payCash" /> Cash</label>
                </div>
                <div id="checkNumberRow" class="hidden" style="margin-top:8px">
                  <label>Check Number</label>
                  <input id="checkNumber" placeholder="Check number" />
                </div>
                <textarea id="notes" placeholder="Notes (optional)"></textarea>
                <button id="saveOrderBtn">Save Order (offline-capable)</button>
              </div>
              <div class="col-2">
                <h2>Status</h2>
                <div id="networkStatus" class="status-offline">Offline</div>
                <div id="syncStatus">Not synced</div>
              </div>
            </div>

            <section class="orders">
              <h3>Local Orders</h3>
              <div id="ordersList"></div>
            </section>
          </section>
        </main>

        <script src="/app.js"></script>
        <script>
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js').then(()=>console.log('sw registered'))
            .catch(err=>console.warn('sw register failed', err));
          }
        </script>
      </body>
    </html>
