<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Subsales — PWA</title>
    <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
    <meta name="theme-color" content="#2d6cdf" />
    <style>/* Hide auth-only controls in the PWA shell until client reveals them */
      .sm-auth-hidden{display:none!important;visibility:hidden!important}
    </style>
  
  </head>
  <body>
    <header class="sm-header">
      <div class="sm-header-left"></div>
      <div class="sm-header-center">
        <img id="brandHeaderImage" class="sm-brand-image hidden" />
        <h1 class="sm-brand-name">Subsales</h1>
      </div>
      <div class="sm-header-right">
        <div id="headerStatus" title="Network status"><span id="headerDot" class="sm-header-dot"></span><span id="headerStatusText">Offline</span></div>
        <div id="installBox" class="hidden sm-auth-hidden"><button id="installBtn" class="sm-btn">Install App</button></div>
        <button id="forceSyncBtn" title="Force sync offline orders" class="sm-btn sm-auth-hidden">Sync now</button>
        <button id="myOrdersBtn" class="sm-btn sm-auth-hidden">My orders</button>
        <button id="logoutBtn" title="Log out" class="sm-btn sm-auth-hidden">Log out</button>
  <button id="openInlayBtn" class="sm-btn hidden sm-auth-hidden">Queued Orders</button>
      </div>
    </header>

    <main>
      <section id="loginSection" class="sm-login-section">
        <!-- Legacy login (team+code) -->
        <div id="legacyLogin" class="sm-login-mode">
          <h2>Team Login</h2>
          <p>Sign in with your team name and access code.</p>
          <input id="teamName" placeholder="Team name" />
          <input id="teamCode" placeholder="Access code" />
          <div class="btn-row"><button id="loginBtn" class="sm-btn">Login</button></div>
        </div>
        
        <!-- User login (name+phone) -->
        <div id="userLogin" class="sm-login-mode hidden">
          <h2>Login</h2>
          <p>Sign in with your name and phone number.</p>
          <label>Full Name</label>
          <input id="userName" list="userSuggestions" placeholder="Start typing your name..." autocomplete="off" />
          <datalist id="userSuggestions"></datalist>
          <label>Phone Number</label>
          <input id="userPhone" type="tel" inputmode="tel" placeholder="10 digits" maxlength="10" pattern="[0-9]{10}" autocomplete="off" />
          <div id="teamSelectRow" class="sm-row hidden">
            <label>Select Team</label>
            <select id="userTeamSelect">
              <option value="">-- Select team --</option>
            </select>
          </div>
          <div id="individualSalesRow" class="sm-row hidden">
            <label><input type="checkbox" id="individualSales" /> Individual Sales (not for a team)</label>
          </div>
          <div class="btn-row"><button id="userLoginBtn" class="sm-btn">Login</button></div>
        </div>
      </section>

      <section id="appSection" class="hidden" style="display:none">
        <div class="row">
          <div class="col-2">
            <h2>Create Order</h2>
            <input id="customerName" placeholder="Customer name" />
            <input id="address" placeholder="Address" />
            <input id="cellNumber" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Cell number" />
            <div class="row row-spaced">
              <div id="productsContainer" class="row row-products" style="width:100%; display:flex; gap:8px; flex-wrap:wrap"></div>
            </div>
            <label>Donation amount (USD)</label>
            <input id="donationAmount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="$0.00" />
            <div class="order-total"><strong>Order total: <span id="orderTotal">$0.00</span></strong></div>
            <div class="pay-options">
              <label><input type="checkbox" id="payCheck" /> <span>Pay by check</span></label>
              <label><input type="checkbox" id="payCash" /> <span>Pay by cash</span></label>
            </div>
            <div id="checkNumberRow" class="check-number-row hidden"><label>Check number</label><input id="checkNumber" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Check number" /></div>
            <label>Delivery Instructions</label>
            <textarea id="notes" placeholder="house color, long driveway etc"></textarea>
            <div class="btn-row"><button id="saveOrderBtn" class="sm-btn">Save Order</button></div>
          </div>
       </div>

        <!-- Local orders moved to My Orders modal/inlay; removed from main view -->
      </section>
    </main>

    <script>
      (function(){
        // Apply runtime admin config to the PWA shell when possible.
        function applyConfig(cfg){
          try{
            if(!cfg) return;
            const primary = cfg.primaryColor || cfg.primary_color || cfg.primary || '';
            const variant = cfg.styleVariant || cfg.style_variant || cfg.style || '';
            if(primary) document.documentElement.style.setProperty('--sm-primary', primary);
            if(variant){
              document.documentElement.classList.remove('sm-variant-default','sm-variant-flat','sm-variant-rounded','sm-variant-dark');
              document.documentElement.classList.add('sm-variant-' + variant);
            }
            if(cfg.brandName){ try{ document.title = cfg.brandName + ' — PWA'; const h = document.querySelector('.sm-brand-name'); if(h) h.textContent = cfg.brandName; }catch(e){} }
            if(cfg.brandingImage){ try{ const img = document.getElementById('brandHeaderImage'); if(img){ img.src = cfg.brandingImage; img.classList.remove('hidden'); } }catch(e){} }
                // Persist values for offline shells
                try{ if(cfg.primaryColor) localStorage.setItem('subsales_primary', cfg.primaryColor); if(cfg.styleVariant) localStorage.setItem('subsales_variant', cfg.styleVariant); if(cfg.brandingImage) localStorage.setItem('subsales_brandingImage', cfg.brandingImage); }catch(e){}
                // If pluginBase is available, rewrite manifest, stylesheet and app.js references to absolute plugin paths
                try{
                  if (cfg.pluginBase) {
                    var pluginBase = cfg.pluginBase.replace(/\/$/, '') + '/';
                    // manifest
                    var m = document.querySelector('link[rel="manifest"]');
                    if (m) m.setAttribute('href', pluginBase + 'manifest.json');
                    // stylesheet - if it's a relative href, rewrite to plugin path
                    var s = document.querySelector('link[rel="stylesheet"]');
                    if (s) {
                      var href = s.getAttribute('href') || '';
                      if (!href.match(/^https?:\/\//i)) s.setAttribute('href', pluginBase + 'styles.css');
                    }
                    // app.js script tag (if present with relative src)
                    var appScript = document.querySelector('script[src="app.js"]');
                    if (appScript) appScript.setAttribute('src', pluginBase + 'app.js');
                  }
                }catch(e){}
          }catch(e){/* noop */}
        }

        // First, apply any previously persisted values (so offline shells can pick them up)
        try{
          const prevPrimary = localStorage.getItem('subsales_primary');
          const prevVariant = localStorage.getItem('subsales_variant');
          const prevBrandImg = localStorage.getItem('subsales_brandingImage');
          if (prevPrimary) document.documentElement.style.setProperty('--sm-primary', prevPrimary);
          if (prevVariant) { document.documentElement.classList.remove('sm-variant-default','sm-variant-flat','sm-variant-rounded','sm-variant-dark'); document.documentElement.classList.add('sm-variant-' + prevVariant); }
          if (prevBrandImg){ try{ const img = document.getElementById('brandHeaderImage'); if(img){ img.src = prevBrandImg; img.classList.remove('hidden'); } }catch(e){} }
        }catch(e){}

        // Prefer localized config object when present; apply and persist
        if (window.SUBSALES_PWA_CONFIG) {
          applyConfig(window.SUBSALES_PWA_CONFIG);
        }

        // Try to fetch the server config when online (best-effort, non-blocking) and persist
        if (navigator.onLine) {
          try{
            fetch('/wp-json/order-manager/v1/config', {cache: 'no-store'}).then(function(r){
              if (!r.ok) return null; return r.json();
            }).then(function(cfg){ if(cfg){ applyConfig(cfg); } }).catch(function(){/* ignore */});
          }catch(e){}
        }
      })();
    </script>
    <script src="app.js"></script>
    <script>
      // Dynamically load address-autocomplete.js relative to the resolved app.js location.
      (function(){
        try{
          var appScript = document.querySelector('script[src$="app.js"]');
          if(appScript){
            var base = appScript.src.replace(/app\.js(\?.*)?$/,'');
            var s = document.createElement('script');
            s.src = base + 'address-autocomplete.js';
            s.defer = true;
            document.head.appendChild(s);
          } else {
            // fallback to relative path
            var s2 = document.createElement('script'); s2.src = 'address-autocomplete.js'; s2.defer = true; document.head.appendChild(s2);
          }
        }catch(e){ console.warn('failed to load address-autocomplete dynamically', e); }
      })();
    </script>
    <script>
      // Service worker registration is handled by the plugin-localized config in the embedded page
      const cfg = window.SUBSALES_PWA_CONFIG || null;
      if (cfg && cfg.brandName) {
        try { document.title = cfg.brandName + ' — PWA'; } catch(e){}
        const h = document.querySelector('h1'); if (h) h.textContent = cfg.brandName;
        const img = document.getElementById('brandHeaderImage'); if (img && cfg.brandingImage) { img.src = cfg.brandingImage; img.classList.remove('hidden'); }
        const openBtn = document.getElementById('openInlayBtn'); if (openBtn) openBtn.classList.add('hidden');
      }
      if ('serviceWorker' in navigator && cfg && cfg.pluginBase) {
        navigator.serviceWorker.register(cfg.pluginBase + 'service-worker.js', { scope: cfg.pluginBase })
          .then(()=>console.log('sw registered'))
          .catch(err=>console.warn('sw register failed', err));
      }
    </script>
  </body>
</html>
