name: Release plugin zip

# Triggered by pushing a version tag: git tag v3.1.0 && git push --tags
# Builds the WordPress-installable zip and publishes it as a GitHub Release
# asset. plugin-update-checker (wordpress-plugin/subsales-management.php)
# reads its "latest version" from the release tag name, so the tag MUST
# match the Version: header shipped inside the zip - this workflow refuses
# to release if they disagree instead of shipping a plugin that
# update-loops forever.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify plugin header matches the tag
        run: |
          HEADER_VERSION=$(grep -oP "Version: \Kv?[0-9]+\.[0-9]+\.[0-9]+" wordpress-plugin/subsales-management.php | sed 's/^v//')
          if [ "$HEADER_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} does not match the plugin header version ($HEADER_VERSION)."
            echo "::error::plugin-update-checker reads the release TAG as the version WordPress compares against,"
            echo "::error::and the zip's own header as the installed version after updating. If they disagree,"
            echo "::error::the site will show 'update available' forever. Bump the header to ${{ steps.version.outputs.version }}, commit, then re-tag."
            exit 1
          fi
          echo "Header version $HEADER_VERSION matches tag - proceeding."

      - name: Lint all PHP files
        run: |
          set -e
          find wordpress-plugin -type f -name "*.php" \
            -not -path "*/vendor/*" \
            -not -path "*/lib/plugin-update-checker/vendor/*" \
            -print0 | xargs -0 -n1 php -l

      - name: Stage plugin files
        run: |
          set -e
          PACKAGE_DIR="package"
          PLUGIN_DIR="$PACKAGE_DIR/subsales-management"
          mkdir -p "$PLUGIN_DIR"

          # wordpress-plugin/ is already the clean plugin directory - the
          # repo root's ad hoc release zips / data dumps / planning docs
          # live outside it and are never touched by this copy.
          cp -r wordpress-plugin/. "$PLUGIN_DIR/"

          # Strip vendored translation-template cruft from plugin-update-checker
          find "$PLUGIN_DIR/lib/plugin-update-checker/languages" -name "*.po" -delete 2>/dev/null || true

      - name: Create zip
        id: zip
        run: |
          set -e
          ZIP_NAME="subsales-management-v${{ steps.version.outputs.version }}.zip"
          (cd package && zip -r "../$ZIP_NAME" subsales-management/ > /dev/null)
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.zip.outputs.zip_name }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
